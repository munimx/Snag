<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Snag CLI terminal screenshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="#0b1020"/>
  <rect x="24" y="24" width="1232" height="712" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="56" cy="52" r="8" fill="#ef4444"/>
  <circle cx="82" cy="52" r="8" fill="#f59e0b"/>
  <circle cx="108" cy="52" r="8" fill="#22c55e"/>
  <text x="640" y="57" text-anchor="middle" fill="#93c5fd" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">snag-cli terminal</text>

  <g fill="#e2e8f0" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
    <text x="52" y="110">$ snag --help</text>
    <text x="52" y="150">Usage: snag [options] [command]</text>
    <text x="52" y="184">Commands: listen, inspect, replay, login</text>

    <text x="52" y="246">$ snag listen 3000 --server https://snag-server.fly.dev --json</text>
    <text x="52" y="286">{"token":"cli_41d0b5","serverUrl":"https://snag-server.fly.dev","port":3000}</text>
    <text x="52" y="320">{"id":"req_416bc7019097","method":"POST","path":"/h/cli_41d0b5","status":null}</text>

    <text x="52" y="382">$ snag inspect req_416bc7019097 --server https://snag-server.fly.dev --json</text>
    <text x="52" y="422">{"id":"req_416bc7019097","bodyType":"json","receivedAt":"2026-04-15T13:21:03.679Z"}</text>

    <text x="52" y="484">$ snag replay req_416bc7019097 --target https://httpbin.org/post --json</text>
    <text x="52" y="524">{"id":"rep_db6103cbfa89","responseStatus":200,"latencyMs":136}</text>

    <text x="52" y="586">$ snag login --email dev@example.com --server https://snag-server.fly.dev</text>
    <text x="52" y="626">Logged in as dev@example.com</text>
  </g>
</svg>
