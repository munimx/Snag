<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Snag MCP terminal screenshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="#080d1a"/>
  <rect x="24" y="24" width="1232" height="712" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="56" cy="52" r="8" fill="#ef4444"/>
  <circle cx="82" cy="52" r="8" fill="#f59e0b"/>
  <circle cx="108" cy="52" r="8" fill="#22c55e"/>
  <text x="640" y="57" text-anchor="middle" fill="#a7f3d0" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">snag-mcp JSON-RPC session</text>

  <g fill="#e5e7eb" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
    <text x="52" y="110">$ SNAG_SERVER_URL=https://snag-server.fly.dev snag-mcp</text>

    <text x="52" y="166">{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}</text>
    <text x="52" y="202">{"jsonrpc":"2.0","id":1,"result":{"serverInfo":{"name":"snag-mcp","version":"1.26.0"}}}</text>

    <text x="52" y="260">{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}</text>
    <text x="52" y="296">{"jsonrpc":"2.0","id":2,"result":{"tools":[snag_create_endpoint, snag_list_requests, ...]}}</text>

    <text x="52" y="354">{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"snag_create_endpoint","arguments":{"label":"mcp-demo"}}}</text>
    <text x="52" y="390">{"jsonrpc":"2.0","id":3,"result":{"content":[{"type":"text","text":"{"token":"tok_f742e349..."}"}]}}</text>

    <text x="52" y="448">{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"snag_wait_for_request","arguments":{"token":"tok_f742e349...","timeoutMs":10000}}}</text>
    <text x="52" y="484">{"jsonrpc":"2.0","id":4,"result":{"content":[{"type":"text","text":"{"id":"req_527378a...","method":"POST"}"}]}}</text>

    <text x="52" y="542">{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"snag_replay_request","arguments":{"id":"req_527378a...","targetUrl":"https://httpbin.org/post"}}}</text>
    <text x="52" y="578">{"jsonrpc":"2.0","id":5,"result":{"content":[{"type":"text","text":"{"responseStatus":200,"latencyMs":126}"}]}}</text>

    <text x="52" y="636">{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"snag_delete_endpoint","arguments":{"token":"tok_f742e349..."}}}</text>
    <text x="52" y="672">{"jsonrpc":"2.0","id":6,"result":{"content":[{"type":"text","text":"{"ok":true}"}]}}</text>
  </g>
</svg>
